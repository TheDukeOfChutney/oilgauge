name: Collect motor-oil prices

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *"
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test extractor
        run: npm run test:collector
      - name: Collect configured products
        id: collect
        continue-on-error: true
        run: npm run collect
      - name: Commit refreshed feed
        run: |
          if git diff --quiet -- public/offers.json; then
            echo "No feed changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/offers.json
          git commit -m "chore: refresh verified oil offers"
          git push
      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "No verified offers were collected. See public/offers.json errors."
          exit 1
