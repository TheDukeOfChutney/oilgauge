name: Collect motor-oil prices
on:
  workflow_dispatch:
  schedule:
    - cron: "23 11 * * *"
permissions:
  contents: write
concurrency:
  group: collect-prices
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:collector
      - run: npm run collect
      - name: Commit refreshed feed
        run: |
          if git diff --quiet -- public/offers.json; then exit 0; fi
          git config user.name "oilgauge-bot"
          git config user.email "oilgauge-bot@users.noreply.github.com"
          git add public/offers.json
          git commit -m "Refresh motor-oil prices"
          git push
