name: Test OilGauge

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "public/offers.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:collector
      - run: npm test
